events {}

http {
  upstream trading_terminal {
    server trading-terminal:80;
  }

  upstream oms_service {
    server oms-service:8080;
  }

  upstream position_service {
    server position-service:8081;
  }

  upstream pnl_service {
    server pnl-service:8082;
  }

  upstream risk_service {
    server risk-service:8083;
  }

  upstream market_data_service {
    server market-data-service:8084;
  }

  upstream analytics_service {
    server analytics-service:8085;
  }

  upstream fix_gateway_service {
    server fix-gateway-service:8086;
  }

  upstream replay_service {
    server replay-service:8087;
  }

  server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~ ^/api/(orders|order-book|trades)(/?.*)$ {
      rewrite ^/api/(orders|order-book|trades)(/?.*)$ /$1$2 break;
      proxy_pass http://oms_service;
    }

    location ~ ^/api/positions(/?.*)$ {
      rewrite ^/api/positions(/?.*)$ /positions$1 break;
      proxy_pass http://position_service;
    }

    location ~ ^/api/pnl(/?.*)$ {
      rewrite ^/api/pnl(/?.*)$ /pnl$1 break;
      proxy_pass http://pnl_service;
    }

    location ~ ^/api/market-prices(/?.*)$ {
      rewrite ^/api/market-prices(/?.*)$ /market-prices$1 break;
      proxy_pass http://pnl_service;
    }

    location ~ ^/api/risk(/?.*)$ {
      rewrite ^/api/risk(/?.*)$ /risk$1 break;
      proxy_pass http://risk_service;
    }

    location ~ ^/api/market-data(/?.*)$ {
      rewrite ^/api/market-data(/?.*)$ /market-data$1 break;
      proxy_pass http://market_data_service;
    }

    location ~ ^/api/analytics(/?.*)$ {
      rewrite ^/api/analytics(/?.*)$ /analytics$1 break;
      proxy_pass http://analytics_service;
    }

    location ~ ^/api/fix(/?.*)$ {
      rewrite ^/api/fix(/?.*)$ /fix$1 break;
      proxy_pass http://fix_gateway_service;
    }

    location ~ ^/api/replay(/?.*)$ {
      rewrite ^/api/replay(/?.*)$ /replay$1 break;
      proxy_pass http://replay_service;
    }

    location / {
      proxy_pass http://trading_terminal;
    }
  }
}
