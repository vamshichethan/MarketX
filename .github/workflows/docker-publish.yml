name: Docker Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  publish:
    name: Build and publish Docker images
    runs-on: ubuntu-latest
    if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build images
        run: docker compose build

      - name: Tag images
        run: |
          for image in \
            oms-service \
            risk-service \
            position-service \
            pnl-service \
            market-data-service \
            analytics-service \
            fix-gateway-service \
            replay-service \
            trading-terminal
          do
            docker tag "marketx/${image}:latest" "${{ secrets.DOCKERHUB_USERNAME }}/marketx-${image}:latest"
          done

      - name: Push images
        run: |
          for image in \
            oms-service \
            risk-service \
            position-service \
            pnl-service \
            market-data-service \
            analytics-service \
            fix-gateway-service \
            replay-service \
            trading-terminal
          do
            docker push "${{ secrets.DOCKERHUB_USERNAME }}/marketx-${image}:latest"
          done
