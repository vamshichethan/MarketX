server:
  port: 8084

spring:
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

marketx:
  market-data:
    symbols:
      AAPL: 150.00
      MSFT: 420.00
      GOOG: 180.00
    publish-rate-ms: 1000
    enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} service=market-data-service level=%5p thread=%t logger=%logger{36} msg=%m%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: market-data-service
