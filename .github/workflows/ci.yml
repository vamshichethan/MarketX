name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install common events
        run: mvn -f backend/common-events/pom.xml clean install

      - name: Build and test services
        run: |
          for service in \
            oms-service \
            risk-service \
            position-service \
            pnl-service \
            market-data-service \
            analytics-service \
            fix-gateway-service \
            replay-service
          do
            mvn -f "backend/${service}/pom.xml" clean test
          done

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/trading-terminal/package-lock.json

      - name: Install dependencies
        working-directory: frontend/trading-terminal
        run: npm ci

      - name: Build terminal
        working-directory: frontend/trading-terminal
        run: npm run build

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build compose images
        run: docker compose build
